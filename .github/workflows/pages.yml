name: Deploy wiki to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      record_existing_migrations:
        description: 'One-time setup: all eight original SQL files are already applied in this database'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check out the app manual
        uses: actions/checkout@v6
        with:
          repository: pxib/lrcplus
          ref: release
          path: .app-manual
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/manual/
            /docs/onboarding-engine.md
            /assets/onboarding/CANON_CHARACTER.md
            /LRCX_SPEC.md
            /PLUGIN_API.md

      - name: Import shared articles
        id: manual
        shell: bash
        run: |
          digest=$(python3 tools/import-app-manual.py .app-manual docs/manual)
          publish=true
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            publish=false
            manifest=$(curl -fSsL --retry 2 --max-time 15 \
              "https://pxib.github.io/lrcpluswiki/version.json?run=$GITHUB_RUN_ID")
            # Scheduled doc updates may only deploy wiki code already published by a normal run.
            if jq -e --arg revision "$GITHUB_SHA" --arg digest "$digest" \
              '.wikiRevision == $revision and .manualDigest != $digest' <<< "$manifest" >/dev/null; then
              publish=true
            fi
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Check published files
        run: node tools/check-pages.cjs

      - name: Install Supabase CLI
        if: github.event_name != 'schedule' && (vars.SUPABASE_MIGRATIONS_ENABLED == 'true' || inputs.record_existing_migrations == true)
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply database migrations
        if: github.event_name != 'schedule' && (vars.SUPABASE_MIGRATIONS_ENABLED == 'true' || inputs.record_existing_migrations == true)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          RECORD_EXISTING: ${{ inputs.record_existing_migrations }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          if [[ "$RECORD_EXISTING" == "true" ]]; then
            # Frozen adoption list: never add future migrations here.
            supabase migration repair \
              20261113000001 20261113000002 20261113000003 20261113000004 \
              20261113000005 20261113000006 20261113000007 20261113000008 \
              --status applied --remote --yes
          fi
          supabase db push --remote --dry-run
          supabase db push --remote --yes

      - name: Deploy self-service account deletion
        if: github.event_name != 'schedule' && (vars.SUPABASE_MIGRATIONS_ENABLED == 'true' || inputs.record_existing_migrations == true)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase functions deploy delete-account --remote="$SUPABASE_PROJECT_ID" --yes

      - name: Database automation setup reminder
        if: github.event_name != 'schedule' && vars.SUPABASE_MIGRATIONS_ENABLED != 'true' && inputs.record_existing_migrations != true
        run: echo '::notice::Database migrations are disabled. Follow supabase/AUTOMATION.md to complete the one-time setup.'

      - name: Stamp wiki update version
        if: steps.manual.outputs.publish == 'true'
        env:
          MANUAL_DIGEST: ${{ steps.manual.outputs.digest }}
        run: node tools/stamp-wiki-build.cjs

      - name: Configure GitHub Pages
        if: steps.manual.outputs.publish == 'true'
        uses: actions/configure-pages@v5

      - name: Upload wiki
        if: steps.manual.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/manual
          name: ${{ env.PAGES_ARTIFACT_NAME }}

      - name: Wait for uploaded artifact to be discoverable
        if: steps.manual.outputs.publish == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const waitForArtifact = require('./tools/wait-for-pages-artifact.cjs');
            await waitForArtifact({github, context, core, name: process.env.PAGES_ARTIFACT_NAME});

      - name: Deploy GitHub Pages
        if: steps.manual.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
